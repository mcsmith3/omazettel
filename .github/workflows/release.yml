name: OmaStore release

on:
  pull_request:
    branches: [master]
  push:
    tags:
      - 'omazettel-v*'
      - 'v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            image: archlinux:latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: menci/archlinuxarm:base-devel
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    env:
      VERSION: ${{ github.ref_name }}
      ARCH: ${{ matrix.arch }}
      EVENT: ${{ github.event_name }}
    steps:
      - name: Install build dependencies
        run: pacman -Syu --noconfirm --needed base-devel git qt6-base qt6-declarative
      - uses: actions/checkout@v4
      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT" == pull_request ]]; then
            ver=0.0.0-pr
          else
            case "$VERSION" in
              omazettel-v*|v*) ver="${VERSION##*v}" ;;
              *) exit 1 ;;
            esac
            [[ "$ver" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]
          fi
          ./bin/build
          dir="omazettel-$ver-$ARCH-linux"
          install -Dm755 build/omazettel "dist/$dir/bin/omazettel"
          install -Dm644 LICENSE "dist/$dir/share/licenses/omazettel/LICENSE"
          install -Dm644 LICENSES/MIT-omawrite.txt "dist/$dir/share/licenses/omazettel/MIT-omawrite.txt"
          install -Dm644 THIRD-PARTY-NOTICES.md "dist/$dir/share/licenses/omazettel/THIRD-PARTY-NOTICES.md"
          install -Dm644 README.md "dist/$dir/share/doc/omazettel/README.md"
          install -Dm644 skills/omazettel/SKILL.md "dist/$dir/share/omazettel/skills/omazettel/SKILL.md"
          install -Dm644 themed/omazettel.toml.tpl "dist/$dir/share/omazettel/themed/omazettel.toml.tpl"
          install -Dm644 pkgbuild/omazettel.svg "dist/$dir/share/icons/hicolor/scalable/apps/omazettel.svg"
          install -Dm644 pkgbuild/omazettel.desktop "dist/$dir/share/applications/omazettel.desktop"
          tar -C dist -czf "dist/$dir.tar.gz" "$dir"
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum ./*.tar.gz > checksums.txt
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: dist/*.tar.gz
      - uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/checksums.txt
