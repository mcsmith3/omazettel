name: Release

# Pull requests: build and test both architectures, publish nothing.
# A tag omazettel-vX.Y.Z: build, test, and publish the GitHub release with
#   - omazettel-X.Y.Z-<arch>-linux.tar.gz   for OmaStore
#   - omazettel-X.Y.Z-1-<arch>.pkg.tar.zst  the pacman package
#   - omazettel-<arch>.pkg.tar.zst          the same, for install.sh
#   - checksums.txt and SHA256SUMS          checksums of all of them
#   - a build provenance attestation        shown as verified in OmaStore
# The notes come from docs/releases/X.Y.Z.md when it exists.

on:
  pull_request:
    branches: [master]
  push:
    tags:
      - 'omazettel-v*'

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            image: archlinux:latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: menci/archlinuxarm:base-devel
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - name: Install build dependencies
        # pacman's download sandboxes (Landlock and seccomp) fail inside the ARM
        # container on GitHub's runners. The official x86_64 image already turns
        # the filesystem one off; this throwaway build container turns both off.
        run: |
          sed -i 's/^#DisableSandbox/DisableSandbox/' /etc/pacman.conf
          pacman -Syu --noconfirm --needed base-devel git qt6-base qt6-declarative poppler-qt6 ttf-jetbrains-mono
      - uses: actions/checkout@v7
      - name: Build, test and package
        env:
          REF: ${{ github.event_name == 'pull_request' && 'pr' || github.ref_name }}
          ARCH: ${{ matrix.arch }}
        run: bash bin/release-build "$REF" "$ARCH"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/omazettel-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Checksums and notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum ./*.tar.gz > checksums.txt
          sha256sum -- *.tar.gz *.pkg.tar.zst > SHA256SUMS
          cat SHA256SUMS
          version="${TAG#omazettel-v}"
          echo "name=OmaZettel $version" >> "$GITHUB_OUTPUT"
          if [ -f "../docs/releases/$version.md" ]; then
            cp "../docs/releases/$version.md" ../release-notes.md
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            : > ../release-notes.md
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.pkg.tar.zst
      - uses: softprops/action-gh-release@v3
        with:
          name: ${{ steps.notes.outputs.name }}
          body_path: release-notes.md
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/*.tar.gz
            dist/*.pkg.tar.zst
            dist/checksums.txt
            dist/SHA256SUMS
